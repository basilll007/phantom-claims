name: dashboard

# Rebuilds the project dashboard from the committed results on every push.
# The built site is always kept as a downloadable artifact; it is deployed to GitHub Pages
# only when the repository variable PAGES_ENABLED is 'true' (so CI stays green without Pages).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: dashboard
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # full history for the commit timeline
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build dashboard (stdlib only)
        run: python scripts/build_dashboard.py --site _site
      - name: Keep the site as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-site
          path: _site
      - name: Upload Pages artifact
        if: vars.PAGES_ENABLED == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: vars.PAGES_ENABLED == 'true'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
